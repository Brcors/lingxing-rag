<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ document.title }} · 领星文档</title><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"></head>
<body><main class="document-page"><a class="back-link" href="/">← 返回文档问答</a><p class="eyebrow">{{ document.category }}</p><h1>{{ document.title }}</h1><p class="document-path">{{ document.method }} {{ document.api_path }}</p>{% if document.source_url %}<a href="{{ document.source_url }}" target="_blank" rel="noopener noreferrer">查看原始来源 ↗</a>{% endif %}<article class="markdown document-content">{{ content_html|safe }}</article></main></body></html>
